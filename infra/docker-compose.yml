services:

  # ─────────────────────────────────────────
  # NGINX - Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      - WIKI_DOMAIN=${WIKI_DOMAIN}
      - AUTH_DOMAIN=${AUTH_DOMAIN}
    command: >
      /bin/sh -c "
      echo 'resolver 127.0.0.11 valid=30s;
      server {
        listen 80;
        server_name '$$WIKI_DOMAIN';
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / {
          set \$$upstream mediawiki;
          proxy_pass http://\$$upstream:80;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr; }
      }
      server {
        listen 80;
        server_name '$$AUTH_DOMAIN';
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / {
          set \$$upstream casdoor;
          proxy_pass http://\$$upstream:8000;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr; }
      }' > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - mediawiki
      - casdoor
    networks:
      - web

  # ─────────────────────────────────────────
  # CERTBOT - Auto SSL
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - web

  # ─────────────────────────────────────────
  # MARIADB - Shared Database
  # ─────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MEDIAWIKI
  # ─────────────────────────────────────────
  mediawiki:
    image: mediawiki:1.42
    container_name: mediawiki
    restart: unless-stopped
    volumes:
      - mediawiki-images:/var/www/html/images
      # Uncomment after first setup:
      # - ./mediawiki/LocalSettings.php:/var/www/html/LocalSettings.php:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - internal
      - web

  # ─────────────────────────────────────────
  # CASDOOR - Auth (SSO)
  # ─────────────────────────────────────────
  casdoor:
    image: casbin/casdoor:latest
    container_name: casdoor
    restart: unless-stopped
    environment:
      httpport: 8000
      driverName: mysql
      dataSourceName: "${CASDOOR_DB_USER}:${CASDOOR_DB_PASSWORD}@tcp(mariadb:3306)/casdoor"
      runmode: prod
      origin: "https://${AUTH_DOMAIN}"
      staticBaseUrl: "https://cdn.casbin.org"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - internal
      - web

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # mariadb never exposed to internet

volumes:
  mariadb-data:
  mediawiki-images:
  certbot-webroot:
  certbot-certs:

# ============================================================
# ATO BRIEF — Package File  (template)
# Load this single file into the viewer via "LOAD PACKAGE"
#
# Top-level keys (all optional, ato is primary):
#   schema_version: Format version
#   header:   Shared operation metadata
#   registry: Canonical reference definitions
#   ato:      Air Tasking Order
#   aco:      Airspace Control Order
#   spins:    Special Instructions
#   comms:    Frequency Preset Table
#   weather:  Mission Weather Forecast
# ============================================================

schema_version: "1.0"

header:
  operation: YOUR OPERATION
  ato_date: '2026-01-11'
  classification: UNCLAS

# ── Registry — canonical definitions referenced elsewhere ───
# Callsigns, frequencies, and airfields are defined once here
# and referenced by key throughout the rest of the document.
registry:
  callsigns:
    SCREWTOP:    { unit: USAF, type: E-3, role: AWACS primary }
    FALCON5:     { unit: 510vFS, type: F16C, role: CAP flight lead }
  frequencies:
    - { freq_mhz: 243.0, callsign: GUARD, band: UHF, role: Emergency }
    - { freq_mhz: 260.0, callsign: PACKAGE, band: UHF, role: Package primary }
    - { freq_mhz: 261.5, callsign: INTRAFLIGHT, band: UHF, role: Intraflight }
    - { freq_mhz: 121.5, callsign: GUARD, band: VHF, role: Emergency }
  airfields:
    OMAM:
      name: Al Dhafra AB
      coords: N24°14'36" E054°27'07"
      elevation_ft: 77
    OMSJ:
      name: Sharjah Intl
      coords: N25°19'42" E055°31'06"
      elevation_ft: 111
    OTBH:
      name: Al Udeid AB
      coords: N25°06'56" E051°18'58"
      elevation_ft: 130

ato:
  irl_date: '2026-01-11'
  irl_time_zulu: '1900Z'
  ingame_start_time: '0000Z'
  local_offset_hours: 0    # UTC offset for local time display (e.g. 4 for UTC+4)
  ae_flags: [IRL, INGAME]

  global_control:
    primary_freq_mhz: '260.0'
    controlling_unit: SCREWTOP
    aircraft_type: E-3
    bullseye:
      name: COYOTE
      coords: N26°51'19" E056°21'37"

  # ── Tanker definitions ──────────────────────────────────────
  # Defined once at ATO level; missions reference by tanker_id.
  tankers:
    - id: ARCO4
      callsign: ARCO4
      ar_track: AR394
      altitude: FL240

  # ── Airfields used for deploy / recovery ─────────────────
  # Plotted on map with a runway-cross symbol.
  # Full airfield data (coords, elevation) comes from registry.
  # role: deploy | recovery | alternate | divert  (or any string)
  airfields:
    - icao: OMAM
      role: deploy
    - icao: OMSJ
      role: recovery
    - icao: OTBH
      role: alternate

  # ── Carrier positions (estimated) ────────────────────────
  # Carriers move — these are planning estimates only.
  # deploy_coords:   position at start of ATO window
  # recovery_coords: position at end / recovery window
  # Both are plotted on the map with an anchor symbol.
  carriers:
    - id: CVN-71
      name: USS ROOSEVELT
      callsign: ROUGH RIDER
      deploy_coords: N24°30'00" E059°15'00"
      recovery_coords: N24°45'00" E059°30'00"

  # ── Target definitions ───────────────────────────────────
  # Reusable targets referenced by aim_points via target_ref.
  # Plotted on the map as threat/point markers.
  targets:
    - id: SA6-NORTH
      name: SA-6 Battery North
      type: SAM
      coords: N26°30'00" E056°20'00"
      elevation: E350FT
      engagement_range_nm: 13
      max_alt_ft: 40000

    - id: SA6-SOUTH
      name: SA-6 Battery South
      type: SAM
      coords: N26°25'00" E056°15'00"
      elevation: E120FT
      engagement_range_nm: 13
      max_alt_ft: 40000

    - id: FUEL-DEPOT
      name: Fuel Storage Facility
      type: BUILDING
      coords: N26°28'00" E056°18'00"
      elevation: E80FT

  marshal_points:
    - id: MARSHAL-ALPHA
      name: ALPHA
      coords: N24°45'00" E056°00'00"
      altitude: FL250

  missions:
    - unit: 510vFS
      home_base_icao: OMAM
      mission_number: MSN3266
      callsign: FALCON5
      mission_type: CAP
      deploy_location_icao: OMAM
      aar_location_icao: OMAM
      takeoff_time: '2000Z'
      recovery_time: '2300Z'
      # vul_start / vul_end — optional vulnerability window (hatched red on timeline)
      aircraft:
        count: 2
        type: F16C
        loadout: '501+'
      target:
        location: KHASAB AREA
        # Timing — use one of three approaches:
        #   Legacy:  not_earlier_than / not_later_than   (generic window)
        #   TOT:     tot_net / tot_nlt                   (Time on Target — strike/BAI missions)
        #   TOS:     tos / toffs                         (Time on Station / Time OFF Station — CAP/CAS orbit missions)
        tos: '2040Z'
        toffs: '2230Z'
        # Aim points — where weapons are released / where to ID the target.
        aim_points:
          - target_ref: SA6-NORTH        # inherits coords, elevation, name from target
          - target_ref: SA6-SOUTH
            name: SECONDARY              # override the name
          - coords: N26°28'00" E056°18'00"
            name: MANUAL-POINT           # plain aim point, no reference
      # Steer points — route waypoints
      steer_points:
        - coords: N24°30'00" E056°00'00"
          name: SP1
        - coords: N25°15'00" E056°05'00"
          name: SP2
      control:
        primary_freq_mhz: '260.0'
        secondary_freq_mhz: '134.0'
        net_name: SCREWTOP
      # Refuel block references a tanker by id;
      # only mission-specific times are stored here.
      refuel:
        tanker_id: ARCO4
        not_earlier_than: '2143Z'
        not_later_than: '2150Z'

aco:
  id: ACO-XX-XX
  timezone: UTC
  distributing_agency: CAOC
  acms:
    - id: ACM-CAPW
      name: CAP-W
      type: ROZ
      missions: [MSN3266]
      alt_lower: FL200
      alt_upper: FL400
      time_from: '1900Z'
      time_to: '2300Z'
      control_agency: SCREWTOP
      control_freq_mhz: 260.000
      geometry:
        center: N26°51'00" E056°22'00"
        radius_nm: 20

spins:
  version: '1.0'

  # Each section is independent — add, remove, or reorder freely.
  # Entry types inside 'entries':
  #   {label, value, style?}  → key-value row  (style: amber | red | green | blue)
  #   {bullet, style?}        → bullet text
  #   {heading}               → mission block header (groups entries beneath it)
  #   {value}  (no label)     → plain body text (shown in amber as an objective)
  #   {type: orbit_reference} → structured orbit/positional data
  sections:

  - title: C1 — COMMAND & CONTROL
    entries:
    - {label: PRIMARY AWACS,   value: "SCREWTOP / 260.0 MHz", style: green}
    - {label: SECONDARY AWACS, value: "BACKUP / 134.0 MHz"}
    - {label: AIRSPACE CTRL,   value: Via OMAM MTMA}
    - {label: PACKAGE LEAD,    value: FALCON5, style: amber}
    - {label: STRIKE LEAD,     value: FALCON5, style: amber}

  - title: C3 — IFF / SIF
    note: Squawk assigned code. M4 mandatory before departure.
    table:
      headers: [MSN, MODE, CODE]
      cell_classes: [~, ~, iff-code]
      rows:
      - [MSN3266, 3, '4811']

  - title: C4 — RULES OF ENGAGEMENT
    entries:
    - {label: PID REQUIRED, value: "YES — required before weapons release", style: red}
    - {bullet: "NCTR / radar profile"}
    - {bullet: "Correlated track from CRC/AWACS"}
    - {bullet: "Visual ID (VID)"}
    - {label: BVR,            value: "AUTHORIZED — after PID or controller declaration", style: amber}
    - {label: SFC ATTACK,     value: Assigned ATO targets only}
    - {label: DYNAMIC TGT,    value: Requires CAOC approval unless self-defence}
    - {label: CIVILIAN TRAFFIC, value: No Factor}

  - title: C7 — LOST COMMS
    entries:
    - {label: "LOSS AWACS — ACTION", value: Default to package commander control}
    - {label: "LOSS AWACS — ABORT",  value: Abort if comms not restored within 5 minutes, style: red}
    - {label: "LOSS PACKAGE — ACTION", value: Continue if task and ROE remain clear}
    - {label: "LOSS PACKAGE — ABORT",  value: Abort in degraded SA, style: red}
    - {label: LOSS INTRAFLIGHT, value: Continue assigned task. Reestablish post-target.}
    - {label: ABORT,            value: Abort if comms cannot be reestablished, style: red}

  - title: C8 — ABORT CRITERIA
    entries:
    - {bullet: Target PID cannot be confirmed}
    - {bullet: Fuel state prevents safe recovery}
    - {bullet: Major technical faults}

  - title: C9 — SEARCH AND RESCUE
    entries:
    - {label: STATUS, value: Not Simulated}

  - title: C11 — SAFETY
    entries:
    - {label: MIN SEPARATION, value: "5NM / 2000ft outside tactical formation", style: amber}

comms:
  wing_lead: FALCON5

  # Only list populated channels — spare rows are auto-generated for unused channels.
  uhf_presets:
    1:  {callsign: GUARD,       freq_mhz: 243.000, role: Emergency}
    2:  {callsign: PACKAGE,     freq_mhz: 260.000, role: Package primary}
    3:  {callsign: INTRAFLIGHT, freq_mhz: 261.500, role: Intraflight}

  vhf_presets:
    1:  {callsign: GUARD,       freq_mhz: 121.500, role: Emergency}

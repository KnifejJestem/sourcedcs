# ============================================================
# ATO BRIEF — Package File  (template)
# Load this single file into the viewer via "LOAD PACKAGE"
#
# Top-level keys (all optional, ato is primary):
#   schema_version: Format version
#   header:   Shared operation metadata
#   registry: Canonical reference definitions
#   ato:      Air Tasking Order
#   aco:      Airspace Control Order
#   spins:    Special Instructions
#   comms:    Frequency Preset Table
#   weather:  Mission Weather Forecast
# ============================================================

schema_version: "1.0"

header:
  operation:
  ato_date:
  classification:

# ── Registry — canonical definitions referenced elsewhere ───
# Callsigns, frequencies, airfields, carriers, tankers, targets,
# and reference points are defined once here and referenced by key
# throughout the rest of the document.
registry:
  callsigns:
  airfields:

  # ── Carriers ──────────────────────────────────────────────
  # Carrier positions are planning estimates.
  # deploy_coords:   position at start of ATO window
  # recovery_coords: position at end / recovery window
  carriers:

  # ── Tankers ───────────────────────────────────────────────
  # Missions reference tankers by id in their refuel block.
  tankers:

  # ── Targets ───────────────────────────────────────────────
  # Reusable targets with nested aim_points.
  # Missions reference targets by id via target.target_id.
  targets:


  # ── Reference points ──────────────────────────────────────
  # Bullseye, marshal points, named geographic positions.
  # type: bullseye | marshal | ip | cp | geographic
  reference_points:

  # ── Control agencies ───────────────────────────────────────
  # AWACS and CRC control agencies referenced by missions.
  # type: AWACS | CRC
  control_agencies:


ato:
  irl_date:
  irl_time_zulu:
  ingame_start_time:
  local_offset_hours:
  ae_flags:

  global_control:
    agency_id:
    bullseye:

  # ── Airfields used for deploy / recovery ─────────────────
  # Plotted on map with a runway-cross symbol.
  # Full airfield data (coords, elevation) comes from registry.
  # role: deploy | recovery | alternate | divert  (or any string)
  airfields:
  # ── Carriers used in this ATO ────────────────────────────
  # References registry.carriers by id.
  # Full carrier data (name, callsign, coords) comes from registry.
  carriers:
  missions:

aco:
  id:
  timezone:
  distributing_agency:
  acms:


spins:
  version: '1.0'

  # Each section is independent — add, remove, or reorder freely.
  # Entry types inside 'entries':
  #   {label, value, style?}  → key-value row  (style: amber | red | green | blue)
  #   {bullet, style?}        → bullet text
  #   {heading}               → mission block header (groups entries beneath it)
  #   {value}  (no label)     → plain body text (shown in amber as an objective)
  #   {type: orbit_reference} → structured orbit/positional data
  sections:

comms:
  wing_lead:
  uhf_presets:
  vhf_presents:

weather:
  issued:
  valid_from:
  valid_to:
  metars:
  mission_wx:

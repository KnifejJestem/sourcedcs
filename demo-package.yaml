    - mission: 6012
      code: '4821'
    - mission: 6013
      code: '4831'
    - mission: 6014
      code: '4841'
  c4_roe:
    pid:
      required: true
      note: PID required prior to weapons release on air or surface contacts unless hostile act demonstrated.
      valid_sources:
      - NCTR / radar profile
      - Correlated track from CRC/AWACS
      - Visual ID (VID)
      caveat: Unidentified aircraft departing known mixed-use or adversary-controlled bases are NOT automatically
        hostile.
    bvr:
      authorized: true
    surface_attack:
      authorized_targets: Assigned ATO targets only
      dynamic_targeting: Requires CAOC approval unless self-defence
      collateral_damage:
        delegated_levels: 1-3
        higher_requires: CAOC approval
    civilian_traffic: No Factor
  c5_execution:
  - mission: 6011
    objective: Degrade TS-024 radar effectiveness with Maximum Effort
    notes: Reactive SEAD permitted against emitting threat systems tracking package aircraft
  - mission: 6012
    objective: Deny adversary air interference within package airspace
    priority_of_effort:
    - 1. Aircraft targeting MSN 6011
    - 2. Aircraft supporting TS-024 engagement
    - 3. All other hostile air contacts
    orbit: N35°05.098' E035°44.098' AG27 090 10nm
  - mission: 6013
    objective: Deny adversary air interference on MSN 6014
    targeting_range_nm: 65
  - mission: 6014
    objective: Destruction of TS-024R
    secondary_objective: Destruction of TS-024S
  c7_lost_comms:
    loss_awacs:
      action: Default to package commander control
      abort_condition: Abort mission if communication cannot be restored within 5 minutes
    loss_package:
      action: Continue mission if task and ROE remain clear
      abort_condition: Abort in case of degraded situation awareness
    loss_intraflight:
      action: Continue assigned task. Reestablish communication post-target if feasible.
      abort_condition: Abort mission if communication cannot be reestablished
  c8_abort_criteria:
  - Target PID cannot be confirmed
  - Collateral damage risk exceeds authorization
  - Fuel state prevents safe recovery
  - Supporting mission unsuccessful and threat unacceptable
  - Major technical faults
  c9_sar:
    status: Not Simulated
  c11_safety:
    minimum_separation: 5NM / 2000ft between coalition aircraft outside tactical formation

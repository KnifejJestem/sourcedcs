<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050820"/>
      <stop offset="25%" stop-color="#1a0a38"/>
      <stop offset="55%" stop-color="#6b1a10"/>
      <stop offset="75%" stop-color="#c0440a"/>
      <stop offset="100%" stop-color="#e87010"/>
    </linearGradient>
    <linearGradient id="horizon3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e87010" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c06000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#0a0803"/>
    </linearGradient>
  </defs>

  <!-- Dusk sky -->
  <rect width="1280" height="720" fill="url(#sky3)"/>

  <!-- Horizon glow -->
  <rect x="0" y="400" width="1280" height="100" fill="url(#horizon3)" opacity="0.6"/>

  <!-- Sun just at horizon -->
  <ellipse cx="640" cy="468" rx="46" ry="18" fill="#ffe060" opacity="0.7"/>
  <ellipse cx="640" cy="468" rx="80" ry="35" fill="#ff9020" opacity="0.25"/>
  <ellipse cx="640" cy="468" rx="160" ry="60" fill="#ff6010" opacity="0.1"/>

  <!-- Sun reflection on sea/water -->
  <linearGradient id="water3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e1208"/>
    <stop offset="100%" stop-color="#080400"/>
  </linearGradient>
  <rect x="0" y="468" width="1280" height="252" fill="url(#water3)"/>
  <!-- Water shimmer -->
  <g opacity="0.35">
    <ellipse cx="640" cy="490" rx="60" ry="8" fill="#ffb030"/>
    <ellipse cx="640" cy="510" rx="40" ry="5" fill="#ff9020"/>
    <ellipse cx="640" cy="528" rx="25" ry="3" fill="#ff7010"/>
    <ellipse cx="640" cy="545" rx="15" ry="2" fill="#ff5010"/>
  </g>
  <!-- Water wave lines -->
  <g stroke="#2a1a08" stroke-width="1" opacity="0.3">
    <path d="M0,480 Q160,472 320,480 Q480,488 640,480 Q800,472 960,480 Q1120,488 1280,480"/>
    <path d="M0,500 Q160,492 320,500 Q480,508 640,500 Q800,492 960,500 Q1120,508 1280,500"/>
    <path d="M0,520 Q160,512 320,520 Q480,528 640,520 Q800,512 960,520 Q1120,528 1280,520"/>
    <path d="M0,545 Q160,537 320,545 Q480,553 640,545 Q800,537 960,545 Q1120,553 1280,545"/>
  </g>

  <!-- Distant coastline dark silhouette -->
  <path d="M0,468 L40,462 L80,458 L120,464 L160,460 L200,455 L240,461 L280,458 L320,452 L360,458 L400,462 L440,457 L480,464 L520,460 L560,468 L1280,468 L1280,720 L0,720 Z" fill="#100806" opacity="0.7"/>

  <!-- Clouds - dramatic dusk lit -->
  <g>
    <ellipse cx="160" cy="280" rx="180" ry="45" fill="#4a1a08" opacity="0.8"/>
    <ellipse cx="200" cy="255" rx="120" ry="38" fill="#5a2010" opacity="0.7"/>
    <ellipse cx="100" cy="270" rx="90" ry="30" fill="#3a1406" opacity="0.85"/>
    <!-- Cloud edge lit by sun -->
    <ellipse cx="220" cy="250" rx="60" ry="20" fill="#e04010" opacity="0.3"/>
    <ellipse cx="260" cy="260" rx="40" ry="15" fill="#ff6020" opacity="0.25"/>
  </g>
  <g>
    <ellipse cx="900" cy="220" rx="200" ry="50" fill="#3a1008" opacity="0.8"/>
    <ellipse cx="950" cy="195" rx="140" ry="42" fill="#4a1810" opacity="0.7"/>
    <ellipse cx="840" cy="210" rx="100" ry="35" fill="#301006" opacity="0.85"/>
    <!-- Cloud edge lit -->
    <ellipse cx="980" cy="190" rx="70" ry="22" fill="#c83010" opacity="0.3"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="560" cy="320" rx="130" ry="30" fill="#2a0e06"/>
    <ellipse cx="590" cy="305" rx="90" ry="25" fill="#3a1208"/>
    <ellipse cx="620" cy="300" rx="50" ry="18" fill="#e03810" opacity="0.3"/>
  </g>

  <!-- Main aircraft - Su-27 style, large, dramatic angle, with afterburner -->
  <g transform="translate(420,350) rotate(5) scale(1.15)">
    <!-- Afterburner cones -->
    <ellipse cx="100" cy="8" rx="30" ry="9" fill="#ff4000" opacity="0.6"/>
    <ellipse cx="112" cy="8" rx="16" ry="6" fill="#ff7020" opacity="0.8"/>
    <ellipse cx="118" cy="8" rx="8" ry="4" fill="#ffe060" opacity="0.9"/>
    <ellipse cx="100" cy="-8" rx="28" ry="8" fill="#ff4000" opacity="0.55"/>
    <ellipse cx="110" cy="-8" rx="14" ry="5" fill="#ff7020" opacity="0.75"/>
    <ellipse cx="116" cy="-8" rx="7" ry="3.5" fill="#ffe060" opacity="0.9"/>
    <!-- Exhaust glow on fuselage -->
    <ellipse cx="80" cy="0" rx="25" ry="14" fill="#ff5000" opacity="0.2"/>

    <!-- Fuselage - twin engine wide -->
    <ellipse cx="0" cy="0" rx="95" ry="14" fill="#241c18"/>
    <!-- Wings - delta style -->
    <polygon points="-5,-10 -90,40 -90,52 -5,12" fill="#1e1814"/>
    <polygon points="-5,-10 60,30 60,42 -5,12" fill="#1e1814"/>
    <!-- Canards -->
    <polygon points="-40,-10 -70,-30 -68,-24 -40,-4" fill="#241c18"/>
    <polygon points="-40,-10 -15,-28 -14,-22 -40,-4" fill="#241c18"/>
    <!-- Vertical tails -->
    <polygon points="48,-10 66,-50 72,-50 58,0" fill="#241c18"/>
    <polygon points="30,-10 44,-42 50,-42 40,0" fill="#241c18"/>
    <!-- Fuselage intake humps -->
    <ellipse cx="-10" cy="-12" rx="28" ry="6" fill="#201814"/>
    <ellipse cx="-10" cy="12" rx="28" ry="6" fill="#201814"/>
    <!-- Canopy -->
    <ellipse cx="-45" cy="-8" rx="16" ry="6" fill="#2a3040"/>
    <ellipse cx="-47" cy="-9" rx="9" ry="3.5" fill="#6090c0" opacity="0.5"/>
  </g>

  <!-- Wingman at distance -->
  <g transform="translate(800,290) rotate(4) scale(0.4)">
    <ellipse cx="100" cy="0" rx="24" ry="7" fill="#ff4000" opacity="0.5"/>
    <ellipse cx="108" cy="0" rx="12" ry="5" fill="#ff8030" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="95" ry="14" fill="#241c18"/>
    <polygon points="-5,-10 -90,40 -90,52 -5,12" fill="#1e1814"/>
    <polygon points="-5,-10 60,30 60,42 -5,12" fill="#1e1814"/>
    <polygon points="48,-10 66,-50 72,-50 58,0" fill="#241c18"/>
  </g>

  <!-- HUD  -->
  <g font-family="monospace" fill="#ff9040" font-size="12" opacity="0.7">
    <text x="1100" y="340" font-size="11">ALT</text>
    <text x="1100" y="356" font-size="16" font-weight="bold">3200</text>
    <text x="80" y="340" font-size="11">KIAS</text>
    <text x="80" y="356" font-size="16" font-weight="bold">560</text>
    <text x="80" y="390" font-size="11">M</text>
    <text x="80" y="406" font-size="16" font-weight="bold">0.92</text>
    <text x="590" y="80" text-anchor="middle" font-size="11">HDG</text>
    <text x="590" y="96" text-anchor="middle" font-size="16" font-weight="bold">180</text>
    <line x1="450" y1="365" x2="525" y2="365" stroke="#ff9040" stroke-width="1.5" opacity="0.5"/>
    <line x1="655" y1="365" x2="730" y2="365" stroke="#ff9040" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Caption -->
  <rect x="0" y="660" width="1280" height="60" fill="#000" opacity="0.6"/>
  <text x="40" y="695" font-family="monospace" font-size="13" fill="#c0d8c8" letter-spacing="3">DUSK INTERCEPT · COASTAL SWEEP · AFTERBURNER RUN</text>
</svg>

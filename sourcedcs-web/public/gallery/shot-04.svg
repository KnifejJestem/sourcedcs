<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="40%" stop-color="#c8dced"/>
      <stop offset="80%" stop-color="#a0c4de"/>
      <stop offset="100%" stop-color="#88b4d4"/>
    </linearGradient>
    <linearGradient id="snow4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e4ef"/>
      <stop offset="100%" stop-color="#b0c8dc"/>
    </linearGradient>
    <linearGradient id="mtn4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0ecf4"/>
      <stop offset="40%" stop-color="#a8bcc8"/>
      <stop offset="100%" stop-color="#6a8094"/>
    </linearGradient>
  </defs>

  <!-- Overcast sky -->
  <rect width="1280" height="720" fill="url(#sky4)"/>

  <!-- Low cloud layer -->
  <g opacity="0.9">
    <ellipse cx="150" cy="120" rx="220" ry="55" fill="#dde8f2"/>
    <ellipse cx="200" cy="95" rx="160" ry="48" fill="#e4eef6"/>
    <ellipse cx="80" cy="110" rx="120" ry="40" fill="#d8e4ee"/>
    <ellipse cx="350" cy="105" rx="140" ry="42" fill="#e0ecf4"/>
    <ellipse cx="420" cy="85" rx="100" ry="36" fill="#e6f0f8"/>
  </g>
  <g opacity="0.8">
    <ellipse cx="700" cy="100" rx="200" ry="50" fill="#d4e2ee"/>
    <ellipse cx="760" cy="75" rx="150" ry="44" fill="#dce8f2"/>
    <ellipse cx="650" cy="92" rx="110" ry="38" fill="#d0dcea"/>
    <ellipse cx="900" cy="80" rx="180" ry="46" fill="#d8e6f0"/>
  </g>
  <g opacity="0.85">
    <ellipse cx="1100" cy="115" rx="210" ry="52" fill="#d6e4ee"/>
    <ellipse cx="1160" cy="88" rx="150" ry="44" fill="#dceaf4"/>
    <ellipse cx="1040" cy="105" rx="120" ry="40" fill="#d2e0ec"/>
  </g>

  <!-- Mountains background -->
  <path d="M0,400 L80,320 L160,380 L240,290 L320,350 L400,260 L480,330 L560,250 L640,310 L720,240 L800,300 L880,230 L960,295 L1040,250 L1120,310 L1200,260 L1280,320 L1280,720 L0,720 Z" fill="url(#mtn4)"/>

  <!-- Snow caps on mountains -->
  <g fill="#e8f0f6" opacity="0.9">
    <path d="M240,290 L260,318 L220,318 Z"/>
    <path d="M400,260 L425,295 L375,295 Z"/>
    <path d="M560,250 L590,290 L530,290 Z"/>
    <path d="M720,240 L752,282 L688,282 Z"/>
    <path d="M880,230 L914,274 L846,274 Z"/>
    <path d="M1040,250 L1072,290 L1008,290 Z"/>
    <path d="M1200,260 L1228,296 L1172,296 Z"/>
  </g>

  <!-- Valley ground with snow -->
  <rect x="0" y="500" width="1280" height="220" fill="url(#snow4)"/>
  <!-- Snow texture lines -->
  <g stroke="#c0d0e0" stroke-width="0.8" opacity="0.4">
    <path d="M0,520 Q320,510 640,520 Q960,530 1280,520"/>
    <path d="M0,560 Q320,550 640,560 Q960,570 1280,560"/>
    <path d="M0,600 Q320,590 640,600 Q960,610 1280,600"/>
  </g>
  <!-- Snow shadows -->
  <g fill="#b0c4d8" opacity="0.3">
    <ellipse cx="200" cy="540" rx="80" ry="15"/>
    <ellipse cx="600" cy="560" rx="100" ry="18"/>
    <ellipse cx="900" cy="530" rx="90" ry="14"/>
    <ellipse cx="1150" cy="550" rx="70" ry="12"/>
  </g>

  <!-- Conifer tree line -->
  <g fill="#2a3c28" opacity="0.85">
    <polygon points="120,500 128,480 136,500"/><polygon points="150,500 158,476 166,500"/>
    <polygon points="180,500 188,482 196,500"/><polygon points="210,500 218,470 226,500"/>
    <polygon points="240,500 248,478 256,500"/><polygon points="270,500 278,472 286,500"/>
    <polygon points="800,500 808,476 816,500"/><polygon points="828,500 836,470 844,500"/>
    <polygon points="856,500 864,478 872,500"/><polygon points="884,500 892,472 900,500"/>
    <polygon points="1050,500 1058,480 1066,500"/><polygon points="1080,500 1088,474 1096,500"/>
    <polygon points="1108,500 1116,476 1124,500"/><polygon points="1136,500 1144,468 1152,500"/>
  </g>

  <!-- A-10 Warthog style (straight wings, twin engines on tail) -->
  <g transform="translate(500,340) rotate(-6) scale(1.1)">
    <!-- Fuselage - thick, nose heavy -->
    <ellipse cx="0" cy="0" rx="85" ry="16" fill="#2a2e28"/>
    <!-- Gun nose - longer -->
    <rect x="-120" y="-4" width="35" height="8" fill="#252824" rx="2"/>
    <!-- Wings - long, straight -->
    <polygon points="-10,-12 -100,8 -100,18 -10,4" fill="#222620"/>
    <polygon points="-10,-12 80,8 80,18 -10,4" fill="#222620"/>
    <!-- Wingtip weapons -->
    <rect x="-105" y="5" width="16" height="6" fill="#1a1c18" rx="1"/>
    <rect x="84" y="5" width="16" height="6" fill="#1a1c18" rx="1"/>
    <!-- Under-wing ordnance -->
    <rect x="-75" y="10" width="20" height="7" fill="#1e2018" rx="1"/>
    <rect x="-50" y="11" width="18" height="6" fill="#1e2018" rx="1"/>
    <rect x="30" y="10" width="20" height="7" fill="#1e2018" rx="1"/>
    <rect x="52" y="11" width="18" height="6" fill="#1e2018" rx="1"/>
    <!-- Twin engines on tail top -->
    <ellipse cx="62" cy="-16" rx="20" ry="8" fill="#252a22"/>
    <ellipse cx="62" cy="16" rx="20" ry="8" fill="#252a22"/>
    <!-- Engine exhausts -->
    <ellipse cx="82" cy="-16" rx="6" ry="5" fill="#1a1e18"/>
    <ellipse cx="82" cy="16" rx="6" ry="5" fill="#1a1e18"/>
    <!-- V-tail -->
    <polygon points="75,-16 90,-44 96,-42 82,-10" fill="#2a2e28"/>
    <polygon points="75,16 90,44 96,42 82,10" fill="#2a2e28"/>
    <!-- Canopy -->
    <ellipse cx="-35" cy="-10" rx="18" ry="7" fill="#283040"/>
    <ellipse cx="-37" cy="-11" rx="10" ry="4" fill="#5080a0" opacity="0.6"/>
  </g>

  <!-- HUD (monochrome for overcast day) -->
  <g font-family="monospace" fill="#2a4a2a" font-size="12" opacity="0.65">
    <text x="1100" y="340" font-size="11">ALT</text>
    <text x="1100" y="356" font-size="16" font-weight="bold">8200</text>
    <text x="80" y="340" font-size="11">KIAS</text>
    <text x="80" y="356" font-size="16" font-weight="bold">280</text>
    <text x="590" y="80" text-anchor="middle" font-size="11">HDG</text>
    <text x="590" y="96" text-anchor="middle" font-size="16" font-weight="bold">030</text>
    <text x="80" y="390" font-size="11">CAS MODE</text>
    <line x1="450" y1="355" x2="530" y2="355" stroke="#2a4a2a" stroke-width="1.5" opacity="0.5"/>
    <line x1="650" y1="355" x2="730" y2="355" stroke="#2a4a2a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Caption -->
  <rect x="0" y="660" width="1280" height="60" fill="#000" opacity="0.5"/>
  <text x="40" y="695" font-family="monospace" font-size="13" fill="#c0d8c8" letter-spacing="3">CAS MISSION · CAUCASUS WINTER · MOUNTAIN VALLEY RUN</text>
</svg>

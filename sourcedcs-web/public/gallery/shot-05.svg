<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001830"/>
      <stop offset="35%" stop-color="#003060"/>
      <stop offset="65%" stop-color="#005090"/>
      <stop offset="100%" stop-color="#0070b0"/>
    </linearGradient>
    <linearGradient id="sea5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003560"/>
      <stop offset="50%" stop-color="#002448"/>
      <stop offset="100%" stop-color="#001830"/>
    </linearGradient>
  </defs>

  <!-- Deep blue sky -->
  <rect width="1280" height="720" fill="url(#sky5)"/>

  <!-- Cumulus clouds at altitude -->
  <g opacity="0.9">
    <ellipse cx="120" cy="180" rx="180" ry="48" fill="#ccd8e4"/>
    <ellipse cx="160" cy="152" rx="130" ry="44" fill="#dce8f4"/>
    <ellipse cx="60" cy="168" rx="100" ry="36" fill="#c8d4e0"/>
    <ellipse cx="280" cy="162" rx="110" ry="40" fill="#d4e0ec"/>
    <!-- Flat cloud base -->
    <rect x="-20" y="215" width="360" height="12" fill="#b4c4d4" opacity="0.6"/>
  </g>
  <g opacity="0.85">
    <ellipse cx="640" cy="140" rx="200" ry="52" fill="#cad6e4"/>
    <ellipse cx="700" cy="108" rx="150" ry="46" fill="#d8e6f4"/>
    <ellipse cx="575" cy="130" rx="115" ry="40" fill="#c4d2e0"/>
    <ellipse cx="820" cy="125" rx="130" ry="42" fill="#ccd8e8"/>
    <rect x="460" y="185" width="410" height="12" fill="#b0c2d4" opacity="0.55"/>
  </g>
  <g opacity="0.8">
    <ellipse cx="1100" cy="160" rx="190" ry="50" fill="#c8d4e2"/>
    <ellipse cx="1150" cy="128" rx="140" ry="44" fill="#d6e4f2"/>
    <ellipse cx="1020" cy="150" rx="110" ry="38" fill="#c2d0de"/>
    <rect x="880" y="200" width="400" height="12" fill="#aec0d2" opacity="0.5"/>
  </g>

  <!-- Carrier deck at bottom -->
  <rect x="0" y="520" width="1280" height="200" fill="url(#sea5)"/>
  <!-- Carrier flight deck -->
  <rect x="350" y="530" width="680" height="130" fill="#3a3c3e" rx="4"/>
  <!-- Deck markings -->
  <rect x="355" y="535" width="670" height="120" fill="#404245" rx="2"/>
  <!-- Centerline -->
  <line x1="680" y1="535" x2="680" y2="655" stroke="#e0e020" stroke-width="2.5" stroke-dasharray="20,10"/>
  <!-- Runway numbers -->
  <text x="650" y="555" font-family="monospace" font-size="18" fill="#e0e020" opacity="0.7" font-weight="bold">28</text>
  <!-- Landing zone markings -->
  <rect x="440" y="570" width="100" height="70" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <rect x="740" y="570" width="100" height="70" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <!-- Arresting wires -->
  <line x1="360" y1="625" x2="1025" y2="625" stroke="#a0a0a0" stroke-width="1.5" opacity="0.6"/>
  <line x1="360" y1="615" x2="1025" y2="615" stroke="#a0a0a0" stroke-width="1.5" opacity="0.5"/>
  <line x1="360" y1="635" x2="1025" y2="635" stroke="#a0a0a0" stroke-width="1.5" opacity="0.5"/>
  <!-- Island superstructure -->
  <rect x="990" y="502" width="70" height="50" fill="#2a2c2e"/>
  <rect x="1000" y="490" width="8" height="60" fill="#222425"/>
  <rect x="1014" y="485" width="50" height="20" fill="#2a2c2e"/>
  <!-- Radar mast -->
  <line x1="1024" y1="485" x2="1024" y2="460" stroke="#303235" stroke-width="3"/>
  <line x1="1004" y1="460" x2="1044" y2="460" stroke="#303235" stroke-width="2"/>
  <!-- Parked aircraft on deck -->
  <g transform="translate(430,565) scale(0.25)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="90" ry="12" fill="#2a3040"/>
    <polygon points="-20,-8 -75,30 -75,38 -20,10" fill="#242834"/>
    <polygon points="-20,-8 45,22 45,30 -20,10" fill="#242834"/>
    <polygon points="45,-6 60,-36 65,-36 55,0" fill="#2a3040"/>
  </g>
  <g transform="translate(500,558) rotate(15) scale(0.22)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="90" ry="12" fill="#2a3040"/>
    <polygon points="-20,-8 -75,30 -75,38 -20,10" fill="#242834"/>
    <polygon points="-20,-8 45,22 45,30 -20,10" fill="#242834"/>
  </g>
  <g transform="translate(570,550) rotate(-10) scale(0.23)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="90" ry="12" fill="#2a3040"/>
    <polygon points="-20,-8 -75,30 -75,38 -20,10" fill="#242834"/>
    <polygon points="-20,-8 45,22 45,30 -20,10" fill="#242834"/>
  </g>

  <!-- Sea waves -->
  <g stroke="#1e4870" stroke-width="1" fill="none" opacity="0.35">
    <path d="M350,520 Q400,515 450,520 Q500,525 550,520"/>
    <path d="M700,518 Q760,513 820,518 Q880,523 940,518"/>
    <path d="M200,510 Q280,505 360,510 Q440,515 520,510"/>
    <path d="M900,512 Q980,507 1060,512 Q1140,517 1220,512"/>
  </g>

  <!-- Incoming aircraft on approach -->
  <g transform="translate(640,390) rotate(3) scale(1.0)">
    <!-- Gear down visible -->
    <line x1="-20" y1="10" x2="-20" y2="28" stroke="#1e2430" stroke-width="3"/>
    <ellipse cx="-20" cy="30" rx="5" ry="3" fill="#1a1e28" opacity="0.8"/>
    <line x1="10" y1="10" x2="10" y2="26" stroke="#1e2430" stroke-width="3"/>
    <ellipse cx="10" cy="28" rx="5" ry="3" fill="#1a1e28" opacity="0.8"/>
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="88" ry="12" fill="#2a3040"/>
    <!-- Wings -->
    <polygon points="-18,-8 -72,28 -72,36 -18,10" fill="#242838"/>
    <polygon points="-18,-8 48,20 48,28 -18,10" fill="#242838"/>
    <!-- Flaps down -->
    <polygon points="-18,8 -72,34 -72,40 -18,14" fill="#1e2232" opacity="0.7"/>
    <polygon points="-18,8 48,26 48,32 -18,14" fill="#1e2232" opacity="0.7"/>
    <!-- Stabs -->
    <polygon points="54,-4 88,12 88,18 54,6" fill="#242838"/>
    <!-- Tails -->
    <polygon points="42,-6 57,-38 62,-38 52,0" fill="#2a3040"/>
    <polygon points="27,-6 38,-32 42,-32 36,0" fill="#2a3040"/>
    <!-- Canopy -->
    <ellipse cx="-28" cy="-7" rx="14" ry="5" fill="#283040"/>
    <ellipse cx="-30" cy="-8" rx="8" ry="3" fill="#5080b0" opacity="0.5"/>
    <!-- Approach lights flashing -->
    <circle cx="-72" cy="32" r="4" fill="#ff0000" opacity="0.95"/>
    <circle cx="48" cy="24" r="4" fill="#00dd00" opacity="0.95"/>
  </g>

  <!-- HUD IFOLS glideslope indicator -->
  <g font-family="monospace" fill="#39ff7a" font-size="12" opacity="0.7">
    <text x="1100" y="340" font-size="11">ALT</text>
    <text x="1100" y="356" font-size="16" font-weight="bold">1200</text>
    <text x="80" y="340" font-size="11">KIAS</text>
    <text x="80" y="356" font-size="16" font-weight="bold">135</text>
    <text x="590" y="80" text-anchor="middle" font-size="11">HDG</text>
    <text x="590" y="96" text-anchor="middle" font-size="16" font-weight="bold">278</text>
    <text x="80" y="390" font-size="11">GEAR DN</text>
    <text x="80" y="406" font-size="13">FLAPS FULL</text>
    <text x="1100" y="390" font-size="11">HOOK DN</text>
    <!-- Glideslope diamond -->
    <polygon points="590,380 598,370 606,380 598,390" stroke="#39ff7a" stroke-width="1.5" fill="none"/>
    <line x1="450" y1="380" x2="575" y2="380" stroke="#39ff7a" stroke-width="1.5" opacity="0.5"/>
    <line x1="618" y1="380" x2="730" y2="380" stroke="#39ff7a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Caption -->
  <rect x="0" y="660" width="1280" height="60" fill="#000" opacity="0.55"/>
  <text x="40" y="695" font-family="monospace" font-size="13" fill="#c0d8c8" letter-spacing="3">CARRIER APPROACH · PERSIAN GULF · CASE I RECOVERY</text>
</svg>

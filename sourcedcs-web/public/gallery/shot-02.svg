<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000510"/>
      <stop offset="30%" stop-color="#010e20"/>
      <stop offset="70%" stop-color="#0a2240"/>
      <stop offset="100%" stop-color="#142e54"/>
    </linearGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050e0a"/>
      <stop offset="100%" stop-color="#010501"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="1280" height="720" fill="url(#sky2)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.9">
    <circle cx="120" cy="60" r="1.2"/><circle cx="240" cy="30" r="0.8"/>
    <circle cx="380" cy="80" r="1.0"/><circle cx="500" cy="20" r="1.4"/>
    <circle cx="620" cy="55" r="0.9"/><circle cx="740" cy="35" r="1.1"/>
    <circle cx="860" cy="70" r="0.8"/><circle cx="980" cy="25" r="1.3"/>
    <circle cx="1100" cy="60" r="1.0"/><circle cx="1220" cy="40" r="0.9"/>
    <circle cx="60" cy="140" r="0.8"/><circle cx="180" cy="120" r="1.1"/>
    <circle cx="320" cy="155" r="0.7"/><circle cx="460" cy="110" r="1.2"/>
    <circle cx="580" cy="145" r="0.9"/><circle cx="700" cy="125" r="0.8"/>
    <circle cx="820" cy="160" r="1.0"/><circle cx="950" cy="115" r="1.3"/>
    <circle cx="1070" cy="150" r="0.8"/><circle cx="1190" cy="130" r="1.0"/>
    <circle cx="150" cy="220" r="1.0"/><circle cx="290" cy="200" r="0.8"/>
    <circle cx="430" cy="230" r="1.2"/><circle cx="560" cy="185" r="0.9"/>
    <circle cx="680" cy="215" r="0.8"/><circle cx="800" cy="195" r="1.1"/>
    <circle cx="920" cy="240" r="0.7"/><circle cx="1040" cy="210" r="1.0"/>
    <circle cx="1160" cy="225" r="0.8"/>
  </g>

  <!-- Moon -->
  <circle cx="900" cy="110" r="38" fill="#dde8f0" opacity="0.92"/>
  <circle cx="912" cy="104" r="34" fill="#c8d8e4" opacity="0.15"/>
  <!-- Moon craters -->
  <circle cx="888" cy="98" r="5" fill="#c0cdd8" opacity="0.5"/>
  <circle cx="912" cy="118" r="3.5" fill="#c0cdd8" opacity="0.4"/>
  <circle cx="896" cy="124" r="4" fill="#c0cdd8" opacity="0.45"/>

  <!-- Moon glow -->
  <radialGradient id="moonGlow" cx="900" cy="110" r="120" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#dde8f0" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#dde8f0" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#moonGlow)"/>

  <!-- City lights on horizon -->
  <rect x="0" y="480" width="1280" height="240" fill="url(#ground2)"/>
  <g opacity="0.8">
    <!-- City glow patches -->
    <ellipse cx="200" cy="488" rx="120" ry="18" fill="#ff8a00" opacity="0.12"/>
    <ellipse cx="500" cy="485" rx="90" ry="14" fill="#ffaa20" opacity="0.10"/>
    <ellipse cx="800" cy="490" rx="150" ry="20" fill="#ff9010" opacity="0.14"/>
    <ellipse cx="1100" cy="486" rx="100" ry="16" fill="#ffb040" opacity="0.10"/>
  </g>
  <!-- Individual city lights -->
  <g opacity="0.7">
    <rect x="120" y="482" width="2" height="2" fill="#ffcc60"/><rect x="140" y="479" width="1" height="1" fill="#ffaa40"/>
    <rect x="165" y="484" width="2" height="1" fill="#ffcc60"/><rect x="190" y="480" width="1" height="2" fill="#ff9020"/>
    <rect x="210" y="483" width="2" height="2" fill="#ffbb50"/><rect x="235" y="479" width="1" height="1" fill="#ffcc60"/>
    <rect x="260" y="484" width="2" height="1" fill="#ffaa40"/><rect x="280" y="481" width="1" height="2" fill="#ff9020"/>
    <rect x="450" y="481" width="2" height="2" fill="#ffcc60"/><rect x="480" y="478" width="1" height="1" fill="#ffaa40"/>
    <rect x="510" y="483" width="2" height="1" fill="#ffcc60"/><rect x="535" y="480" width="1" height="2" fill="#ff9020"/>
    <rect x="750" y="482" width="2" height="2" fill="#ffcc60"/><rect x="780" y="479" width="1" height="1" fill="#ffaa40"/>
    <rect x="810" y="484" width="2" height="1" fill="#ffcc60"/><rect x="840" y="480" width="1" height="2" fill="#ff9020"/>
    <rect x="860" y="483" width="2" height="2" fill="#ffbb50"/><rect x="890" y="479" width="1" height="1" fill="#ffcc60"/>
    <rect x="1060" y="481" width="2" height="2" fill="#ffcc60"/><rect x="1090" y="478" width="1" height="1" fill="#ffaa40"/>
    <rect x="1120" y="483" width="2" height="1" fill="#ffcc60"/><rect x="1150" y="480" width="1" height="2" fill="#ff9020"/>
  </g>

  <!-- Thin cloud wisps under moon -->
  <ellipse cx="750" cy="160" rx="200" ry="18" fill="#1a2a3a" opacity="0.5"/>
  <ellipse cx="1050" cy="200" rx="140" ry="12" fill="#1a2a3a" opacity="0.4"/>

  <!-- Aircraft - lit by moonlight, banking left  -->
  <g transform="translate(600,380) rotate(8) scale(1.1)">
    <!-- Exhaust glow -->
    <ellipse cx="88" cy="0" rx="22" ry="7" fill="#ff6010" opacity="0.55"/>
    <ellipse cx="95" cy="0" rx="10" ry="4" fill="#ff8030" opacity="0.7"/>
    <ellipse cx="78" cy="5" rx="18" ry="5" fill="#ff6010" opacity="0.45"/>
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="90" ry="12" fill="#1e2428"/>
    <!-- Wing -->
    <polygon points="-15,-8 -72,32 -72,40 -15,10" fill="#181c20"/>
    <polygon points="-15,-8 50,25 50,33 -15,10" fill="#181c20"/>
    <!-- Stabs -->
    <polygon points="58,-4 92,16 92,22 58,6" fill="#181c20"/>
    <polygon points="58,-4 22,12 22,18 58,6" fill="#181c20"/>
    <!-- Tails -->
    <polygon points="42,-6 57,-38 62,-38 52,0" fill="#1e2428" opacity="0.9"/>
    <polygon points="27,-6 38,-32 42,-32 36,0" fill="#1e2428" opacity="0.7"/>
    <!-- Canopy moonlit glint -->
    <ellipse cx="-28" cy="-7" rx="13" ry="5" fill="#2a3848"/>
    <ellipse cx="-30" cy="-8" rx="7" ry="3" fill="#4a7898" opacity="0.5"/>
    <!-- Nav lights -->
    <circle cx="-72" cy="36" r="3" fill="#ff0000" opacity="0.9"/>
    <circle cx="50" cy="29" r="3" fill="#00cc00" opacity="0.9"/>
  </g>

  <!-- Targeting pod reticle overlay -->
  <g stroke="#39ff7a" stroke-width="1.5" fill="none" opacity="0.6">
    <circle cx="400" cy="320" r="40"/>
    <line x1="400" y1="270" x2="400" y2="292"/>
    <line x1="400" y1="348" x2="400" y2="370"/>
    <line x1="350" y1="320" x2="372" y2="320"/>
    <line x1="428" y1="320" x2="450" y2="320"/>
    <rect x="385" y="305" width="30" height="30" fill="none"/>
  </g>
  <text x="455" y="316" font-family="monospace" font-size="10" fill="#39ff7a" opacity="0.6">TGT LOCK</text>

  <!-- HUD elements -->
  <g font-family="monospace" fill="#39ff7a" font-size="12" opacity="0.7">
    <text x="1100" y="340" font-size="11">ALT</text>
    <text x="1100" y="356" font-size="16" font-weight="bold">22800</text>
    <text x="80" y="340" font-size="11">KIAS</text>
    <text x="80" y="356" font-size="16" font-weight="bold">420</text>
    <text x="590" y="90" text-anchor="middle" font-size="11">HDG</text>
    <text x="590" y="106" text-anchor="middle" font-size="16" font-weight="bold">095</text>
    <text x="80" y="390" font-size="11">M</text>
    <text x="80" y="406" font-size="16" font-weight="bold">0.72</text>
    <line x1="460" y1="380" x2="530" y2="380" stroke="#39ff7a" stroke-width="1.5" opacity="0.5"/>
    <line x1="650" y1="380" x2="720" y2="380" stroke="#39ff7a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Mode labels -->
  <text x="80" y="640" font-family="monospace" font-size="10" fill="#39ff7a" opacity="0.6" letter-spacing="2">A/A</text>
  <text x="1150" y="640" font-family="monospace" font-size="10" fill="#39ff7a" opacity="0.6" letter-spacing="2">AUTO</text>

  <!-- Caption bar -->
  <rect x="0" y="660" width="1280" height="60" fill="#000" opacity="0.6"/>
  <text x="40" y="695" font-family="monospace" font-size="13" fill="#c0d8c8" letter-spacing="3">NIGHT OPERATIONS · PERSIAN GULF · OVERWATCH</text>
</svg>

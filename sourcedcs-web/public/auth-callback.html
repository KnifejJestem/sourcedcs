<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating… — SOURCE DCS</title>
  <link rel="icon" href="sourcelogobg.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      gap: 20px;
    }
    .cb-logo { width: 64px; height: 64px; border-radius: 8px; }
    .cb-title {
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      letter-spacing: 4px;
      color: var(--text);
    }
    :root.movie .cb-title { color: var(--accent); }
    .cb-status {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-3);
    }
    .cb-error {
      font-size: 11px;
      color: var(--red);
      max-width: 400px;
      line-height: 1.6;
    }
    .cb-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    :root.movie .cb-spinner { border-top-color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<img class="cb-logo" src="sourcelogobg.png" alt="SOURCE">
<div class="cb-title">SOURCEDCS</div>
<div class="cb-spinner" id="spinner"></div>
<div class="cb-status" id="cbStatus">AUTHENTICATING...</div>
<div class="cb-error" id="cbError" style="display:none"></div>

<script src="/js/auth-callback.js"></script>
</body>
</html>

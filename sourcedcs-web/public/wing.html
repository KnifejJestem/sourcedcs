<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wing Detail — SOURCE DCS</title>
  <link rel="icon" href="sourcelogobg.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scanline"></div>

<header>
  <a class="header-logo-link" href="/">
    <img class="header-logo" src="sourcelogobg.png" alt="SOURCE logo">
    <div class="header-title">SOURCEDCS</div>
  </a>
  <nav class="header-nav" id="mainNav" aria-label="Main navigation">
    <a class="nav-link" href="/#about">ABOUT</a>
    <a class="nav-link active-nav" href="/#subsquadrons">WINGS</a>
    <a class="nav-link" href="schedule.html">SCHEDULE</a>
    <a class="nav-link" href="/#join">JOIN</a>
  </nav>
  <div class="header-spacer"></div>
  <div class="header-right">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false">
      <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
    </button>
    <button class="login-btn" id="loginBtn" onclick="loginWithCasdoor()">LOGIN</button>
    <div class="hdr-toggle-group">
      <span class="hdr-toggle-label">DISPLAY</span>
      <div class="theme-toggle">
        <button class="theme-btn active" data-theme="pro"   onclick="setTheme('pro')">PROF</button>
        <button class="theme-btn"        data-theme="movie" onclick="setTheme('movie')">MFD</button>
      </div>
    </div>
  </div>
</header>

<section class="hero-section" style="padding:48px 24px 40px">
  <div id="wingHero" style="text-align:center;width:100%">
    <div style="color:var(--text-3);font-size:11px;letter-spacing:1px">LOADING WING...</div>
  </div>
</section>

<section class="content-section">
  <div class="section-container">
    <div class="section-label">ABOUT THIS WING</div>
    <div id="wingDetail" style="max-width:720px">
      <div style="color:var(--text-3);font-size:11px;letter-spacing:1px">Loading...</div>
    </div>
  </div>
</section>

<section class="content-section">
  <div class="section-container">
    <div class="section-label">WING ROSTER</div>
    <div class="roster-scroll">
      <table class="roster-table">
        <thead><tr><th>CALLSIGN</th><th>RANK</th><th>AIRFRAME</th><th>ROLE</th><th>STATUS</th></tr></thead>
        <tbody id="wingRosterBody">
          <tr><td colspan="5" style="text-align:center;color:var(--text-3)">LOADING...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-brand-area"><img class="footer-logo" src="sourcelogobg.png" alt="SOURCE"><span class="footer-brand">SOURCEDCS</span></div>
    <div class="footer-links-row">
      <a class="footer-link" href="/">Home</a>
      <span class="footer-sep">&middot;</span>
      <a class="footer-link" id="footerDiscordLink" href="#" target="_blank" rel="noopener">Discord</a>
      <span class="footer-sep">&middot;</span>
      <a class="footer-link" id="footerWikiLink" href="#" target="_blank" rel="noopener">Wiki</a>
      <span class="footer-sep">&middot;</span>
      <a class="footer-link" id="footerGithubLink" href="#" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div class="footer-copy"><span class="footer-text">&copy; 2025 SOURCEDCS</span><span class="footer-sep">&middot;</span><span class="footer-text">MIT License</span></div>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/wing.js"></script>
</body>
</html>
